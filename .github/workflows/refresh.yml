name: Refresh and publish public competitor intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'  # Daily 07:15 UTC (08:15 in British Summer Time)

concurrency:
  group: competitor-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate collector with offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Discover public competitor news
        run: python collector.py

      - name: Monitor selected public marketing pages
        run: python website_monitor.py

      - name: Save refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/intelligence.json docs/site-change-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public competitor intelligence feed"
            git push
          fi

      - name: Smoke test live Pages data and browser sharing headers
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url = 'https://mattiguk-hub.github.io/lighting-competitor-intelligence/intelligence.json'
          origin = 'https://iguzziniuk.htmltolink.dev'
          req = Request(url + '?test=public-check', headers={'Origin': origin, 'User-Agent': 'Mozilla/5.0 (iGuzzini-technical-pilot)'})
          with urlopen(req, timeout=20) as response:
              payload = json.load(response)
              cors = response.headers.get('Access-Control-Allow-Origin', '')
              print('Live Pages feed HTTP status:', response.status)
              print('Access-Control-Allow-Origin:', cors or '(missing)')
              print('Public feed records:', len(payload.get('records', [])))
              assert response.status == 200
              assert isinstance(payload.get('records'), list)
              assert cors in ('*', origin), 'Feed does not permit CORS from HTMLtoLink'
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload latest public research and monitoring
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the public assessment and monitoring endpoints
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          root = 'https://mattiguk-hub.github.io/lighting-competitor-intelligence/'
          origin = 'https://iguzziniuk.htmltolink.dev'
          for filename in ('marketing-assessments.json', 'site-change-monitor.json'):
              for attempt in range(5):
                  try:
                      request = Request(root + filename + '?audit=' + str(time.time()),
                                        headers={'Origin': origin, 'User-Agent': 'Mozilla/5.0 (marketing feed check)'})
                      with urlopen(request, timeout=20) as response:
                          payload = json.load(response)
                          cors = response.headers.get('Access-Control-Allow-Origin')
                          print(filename, 'HTTP', response.status, 'CORS', cors)
                          assert response.status == 200
                          assert cors in ('*', origin), 'Browser origin not allowed'
                          assert payload.get('schema_version') == 1, 'Unexpected published schema'
                          if filename == 'marketing-assessments.json':
                              assert len(payload.get('competitors', {})) == 6
                          else:
                              assert len(payload.get('sources', [])) >= 20
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(3)
          PY
